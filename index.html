<script>
const $=id=>document.getElementById(id);
let rows=JSON.parse(localStorage.getItem('kri_rows')||'[]');
let position=JSON.parse(localStorage.getItem('kri_position')||'null');
let trades=JSON.parse(localStorage.getItem('kri_trades')||'[]');
let lastState=JSON.parse(localStorage.getItem('kri_laststate')||'null');

function n(v){let x=parseFloat(String(v??'').replace(/[$,%]/g,'').replace(/,/g,''));return Number.isFinite(x)?x:null}
function fmt(v,d=2){return v==null?'—':Number(v).toFixed(d)}
function pct(v,d=1){return v==null?'—':Number(v).toFixed(d)+'%'}
function mean(a){a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function ema(vals,len){let a=2/(len+1),out=[];vals.forEach((v,i)=>out.push(i? a*v+(1-a)*out[i-1]:v));return out}
function sma(vals,len,i){if(i<len-1)return null;return mean(vals.slice(i-len+1,i+1))}
function wilder(vals,len){let out=[];for(let i=0;i<vals.length;i++){if(i===0)out[i]=vals[i]||0;else out[i]=((out[i-1]*(len-1))+(vals[i]||0))/len}return out}
function calcRSI(closes,len=14){
 let d=closes.map((v,i)=>i?v-closes[i-1]:0),g=d.map(x=>Math.max(x,0)),l=d.map(x=>Math.max(-x,0));
 let ag=wilder(g,len),al=wilder(l,len);return closes.map((_,i)=>al[i]===0?100:100-(100/(1+ag[i]/al[i])));
}
function wma(vals,len,i){if(i<len-1)return null;let s=0,w=0;for(let k=0;k<len;k++){let wt=k+1;s+=vals[i-len+1+k]*wt;w+=wt}return s/w}
function hullSeries(vals,len){let half=Math.max(1,Math.round(len/2)),root=Math.max(1,Math.round(Math.sqrt(len))),tmp=[];
 for(let i=0;i<vals.length;i++){let a=wma(vals,half,i),b=wma(vals,len,i);tmp[i]=(a==null||b==null)?null:2*a-b}
 return tmp.map((_,i)=>{if(i<root-1||tmp.slice(i-root+1,i+1).some(x=>x==null))return null;return wma(tmp,root,i)});
}
function regZ(vals,i,w=10){if(i<w-1)return null;let y=vals.slice(i-w+1,i+1),x=[...Array(w).keys()],xm=mean(x),ym=mean(y),den=x.reduce((s,v)=>s+(v-xm)**2,0);
 let sl=x.reduce((s,v,k)=>s+(v-xm)*(y[k]-ym),0)/den,inter=ym-sl*xm,fit=x.map(v=>inter+sl*v),res=y.map((v,k)=>v-fit[k]),sd=Math.sqrt(res.reduce((s,v)=>s+v*v,0)/(w-1));return sd?res[w-1]/sd:0}
function dateFromFileName(fileName,txt){
  // Accepts both:
  // 2026-08-10-Quote_tqqq.csv
  // 2026-08-10-Quote.csv
  // and any other filename that starts/contains YYYY-MM-DD.
  const m=String(fileName||'').match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;

  // Fallback: TOS preamble such as "Quote on 8/10/26 18:01:11"
  const q=String(txt||'').match(/Quote on\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i);
  if(q){
    let yy=parseInt(q[3],10); if(yy<100) yy+=2000;
    return `${yy}-${String(q[1]).padStart(2,'0')}-${String(q[2]).padStart(2,'0')}`;
  }
  return null;
}
function csvCells(line){
  return String(line).split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.trim().replace(/^"|"$/g,''));
}
function parseCSV(txt,fileName){
  const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length) return [];

  // TOS Quote exports may include title/preamble lines. Find the real header.
  const headerIndex=lines.findIndex(line=>{
    const low=line.toLowerCase();
    return low.includes('symbol') && low.includes('last') && low.includes('open') && low.includes('high') && low.includes('low');
  });
  if(headerIndex<0) return [];

  const h=csvCells(lines[headerIndex]);
  const key=(names)=>h.findIndex(x=>names.some(z=>x.toLowerCase().replace(/\s+/g,'').includes(z.replace(/\s+/g,''))));
  const ix={
    date:key(['date']),symbol:key(['symbol','ticker']),open:key(['open']),high:key(['high']),
    low:key(['low']),close:key(['close','last']),vol:key(['volume','vol']),rsi:key(['rsi']),
    atr:key(['atr']),ema:key(['ema20']),s50:key(['sma50']),s200:key(['sma200']),avgvol:key(['avgvol20','averagevolume20'])
  };
  const fallbackDate=dateFromFileName(fileName,txt);

  return lines.slice(headerIndex+1).map(line=>{
    const c=csvCells(line);
    const get=i=>i>=0?c[i]:null;
    return {
      date: ix.date>=0 ? get(ix.date) : fallbackDate,
      symbol: ix.symbol>=0 ? get(ix.symbol) : 'TQQQ',
      open:n(get(ix.open)), high:n(get(ix.high)), low:n(get(ix.low)), close:n(get(ix.close)),
      volume:n(get(ix.vol)), rsi:n(get(ix.rsi)), atr:n(get(ix.atr)),
      ema20:n(get(ix.ema)), sma50:n(get(ix.s50)), sma200:n(get(ix.s200)),
      avgVol20:n(get(ix.avgvol))
    };
  }).filter(r=>r.date&&r.close!=null).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function mergeUploadedRows(existing,incoming){
  const map=new Map();
  (existing||[]).forEach(r=>{ if(r&&r.date) map.set(`${r.symbol||'TQQQ'}|${r.date}`,r); });
  (incoming||[]).forEach(r=>{
    if(!r||!r.date) return;
    const k=`${r.symbol||'TQQQ'}|${r.date}`;
    // Same-day upload replaces the live daily bar with the newest TOS values.
    map.set(k,{...(map.get(k)||{}),...r});
  });
  return [...map.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function enrich(rs){
 let c=rs.map(r=>r.close), e20=ema(c,20), rsi14=calcRSI(c,14), rsi39=calcRSI(c,39);
 // Approximate Dad StochRSI pipeline; to be verified against TOS later.
 let st=rsi39.map((v,i)=>{if(i<38)return null;let a=rsi39.slice(i-38,i+1),lo=Math.min(...a),hi=Math.max(...a);return hi===lo?50:100*(v-lo)/(hi-lo)});
 let white=hullSeries(st.map(x=>x??0),3), black=hullSeries(st.map(x=>x??0),2);
 return rs.map((r,i)=>{
   let tr=i?Math.max(r.high-r.low,Math.abs(r.high-c[i-1]),Math.abs(r.low-c[i-1])):r.high-r.low;
   let trs=rs.slice(0,i+1).map((q,j)=>j?Math.max(q.high-q.low,Math.abs(q.high-c[j-1]),Math.abs(q.low-c[j-1])):q.high-q.low);
   let atr=r.atr ?? wilder(trs,14)[i], av=sma(rs.map(x=>x.volume),20,i);
   return {...r,ema20:r.ema20??e20[i],sma50:r.sma50??sma(c,50,i),sma200:r.sma200??sma(c,200,i),rsi:r.rsi??rsi14[i],atr,atrPct:atr/r.close*100,avgVol20:av,volRatio:av?r.volume/av:null,mom3:i>=3?(r.close/c[i-3]-1)*100:null,emaSlope5:i>=5?(e20[i]/e20[i-5]-1)*100:null,reg:regZ(c,i,10),stWhite:white[i],stBlack:black[i],stBull:i>0&&white[i]!=null&&black[i]!=null&&white[i]>black[i]&&white[i-1]<=black[i-1]};
 });
}

function clamp01(v){return Math.max(0,Math.min(1,v))}
function nearMin(value,min,span){
  if(value==null)return 0;
  if(value>=min)return 1;
  return clamp01(1-(min-value)/span);
}
function nearMax(value,max,span){
  if(value==null)return 0;
  if(value<=max)return 1;
  return clamp01(1-(value-max)/span);
}
function nearRange(value,lo,hi,span){
  if(value==null)return 0;
  if(value>=lo&&value<=hi)return 1;
  const d=value<lo?lo-value:value-hi;
  return clamp01(1-d/span);
}
function tradeCloseness(r,prev,type){
  if(!r)return 0;
  let parts=[];
  if(type==='exceptional'){
    parts=[nearMax(r.rsi,30,12),nearMin(r.atrPct,4,2.5),nearMin(r.emaSlope5,-8,6)];
  }else if(type==='normal'){
    parts=[nearRange(r.rsi,30,35,12),nearMin(r.atrPct,4,2.5),nearMin(r.volRatio,1.25,.8),nearMin(r.emaSlope5,-6,6)];
  }else if(type==='active'){
    const reg=nearMax(r.reg,-1,1.5), rsi=nearMax(r.rsi,50,20);
    const base=(r.reg!=null&&r.reg<=-1&&r.rsi<50);
    const st=base?(r.stBull?1:.55):.35;
    parts=[reg,rsi,st];
  }else{
    const dayMove=prev?((r.close/prev.close)-1)*100:null;
    parts=[nearRange(r.reg,-.5,.5,1.2),dayMove==null?0:(dayMove>0?1:clamp01(1+dayMove/4)),r.mom3==null?0:(r.mom3>0?1:clamp01(1+r.mom3/6))];
  }
  return Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100);
}
function setupViewModel(r,prev,type){
  const d=setupDefs[type];
  const conds=setupConditions(r,prev,type);
  const status=setupStatusFromConds(type,conds);
  const closeness=tradeCloseness(r,prev,type);
  const unmet=conds.filter(c=>!c.ok);
  let next=unmet.length?unmet[0].title:'All requirements are lined up.';
  if(type==='active' && r && r.reg!=null&&r.reg<=-1&&r.rsi<50 && conds.length<3) next='Wait for the StochRSI bullish crossover.';
  return {type,d,conds,status,closeness,next};
}
function rankedSetups(r,prev){
  const priority={exceptional:4,normal:3,active:2,continuation:1};
  return ['exceptional','normal','active','continuation']
    .map(type=>setupViewModel(r,prev,type))
    .sort((a,b)=>b.closeness-a.closeness || priority[b.type]-priority[a.type]);
}
function statusColor(status,d){

}

function stateEngine(r, prev){
 if(!r)return {name:'NO DATA',grade:'',state:'NO DATA',color:'var(--muted)',next:'Upload the TOS daily CSV to begin.',checks:[]};
 // priority A+ > A > B > C
 let ex=[['RSI below 30',r.rsi<30,`RSI ${fmt(r.rsi,1)}`],['ATR above 4%',r.atrPct>4,`ATR ${pct(r.atrPct)}`],['20 EMA slope better than -8%',r.emaSlope5>-8,`Slope ${pct(r.emaSlope5)}`]];
 if(ex.every(x=>x[1])) return mk('EXCEPTIONAL REBOUND','A+','LIVE SETUP','var(--green)','Wait for final daily confirmation, then watch the next session entry price.',ex,'exceptional');
 let normal=[['RSI 30–35',r.rsi>=30&&r.rsi<35,`RSI ${fmt(r.rsi,1)}`],['ATR above 4%',r.atrPct>4,`ATR ${pct(r.atrPct)}`],['Volume at least 1.25×',r.volRatio>=1.25,`Volume ${fmt(r.volRatio,2)}×`],['20 EMA slope better than -6%',r.emaSlope5>-6,`Slope ${pct(r.emaSlope5)}`]];
 if(normal.every(x=>x[1])) return mk('NORMAL REBOUND','A','LIVE SETUP','var(--green)','Wait for final daily confirmation, then watch the next session entry price.',normal,'normal');
 let activeBase=r.reg<=-1&&r.rsi<50;
 if(activeBase){
   let active=[['Regression -1.00 or lower',true,`Regression ${fmt(r.reg,2)}`],['RSI below 50',true,`RSI ${fmt(r.rsi,1)}`],['StochRSI bullish crossover',!!r.stBull,`White ${fmt(r.stWhite,1)} / Black ${fmt(r.stBlack,1)}`]];
   if(r.stBull)return mk('ACTIVE','B','LIVE SETUP','var(--green)','Bullish crossover is present. Wait for final daily confirmation.',active,'active');
   return mk('ACTIVE','B','PREPARING','var(--yellow)','Waiting for the StochRSI white line to cross above the black line.',active,'active');
 }
 let cont=[['Regression -0.50 to +0.50',r.reg>=-.5&&r.reg<=.5,`Regression ${fmt(r.reg,2)}`],['Today moving up',prev?r.close>prev.close:false,prev?`${pct((r.close/prev.close-1)*100)}`:'—'],['3-day move positive',r.mom3>0,`3-day ${pct(r.mom3)}`]];
 if(cont.every(x=>x[1]))return mk('CONTINUATION','C','LIVE SETUP','var(--green)','Wait for final daily confirmation. This is the lower-confidence setup.',cont,'continuation');
 // preparing/watch closest
 if(r.rsi>=30&&r.rsi<=40)return mk('NORMAL REBOUND','A','WATCHING','var(--yellow)',`RSI is ${fmt(r.rsi,1)}. Watch for 30–35 and the other Normal conditions.`,normal,'normal');
 if(r.reg<=-0.5||r.rsi<=52){
   let checks=[['Regression -1.00 or lower',r.reg<=-1,`Regression ${fmt(r.reg,2)}`],['RSI below 50',r.rsi<50,`RSI ${fmt(r.rsi,1)}`]];
   let missing=checks.filter(x=>!x[1])[0];
   return mk('ACTIVE','B',checks.filter(x=>x[1]).length?'PREPARING':'WATCHING','var(--yellow)',missing?`Waiting for: ${missing[0]}.`:'Setup is developing.',checks,'active');
 }
 if(r.reg>=-.75&&r.reg<=.75)return mk('CONTINUATION','C','WATCHING','var(--blue)','Regression is near the Continuation zone. Waiting for positive price momentum.',cont,'continuation');
 return mk('NONE','','NO TRADE','var(--muted)','No validated setup is close enough right now. Wait.',[],'none');
}

     ${extra}
   </div>

   <div class="detailSection">
     <div class="detailSectionTitle">Historical backtest</div>
     <div class="detailSectionSub">What happened when this pattern appeared in the TQQQ history we tested.</div>
     <div class="backtestGrid">
       <div class="backBox"><b>${h.win}</b><span>winners</span></div>
       <div class="backBox"><b>${h.avg}</b><span>average result</span></div>
       <div class="backBox"><b>${h.days}</b><span>usual hold</span></div>
       <div class="backBox"><b>${h.sample}</b><span>sample size</span></div>
     </div>
     <div class="warningText">${d.smallSample}</div>
   </div>

   <div class="detailSection">
     <div class="detailSectionTitle">Indicators this setup watches</div>
     <div class="detailSectionSub">Only the indicators that matter for this pattern.</div>
     <div class="indicatorList">${indicators}</div>
   </div>

   <div class="detailSection">
     <div class="detailSectionTitle">What happens next</div>
     <div class="detailStatus" style="margin-top:8px"><div class="detailStatusText">${
       allReady
       ? `The setup is lined up. Review the entry and do not chase more than the allowed 3% above the confirmed signal close.`
       : `Wait for ${v.next}. Do not force a trade just because another indicator looks good.`
     }</div></div>
   </div>`;
}

function openBuyForType(type){
 const r=rows.at(-1),prev=rows.at(-2),v=setupViewModel(r,prev,type);
 if(!v.conds.length||!v.conds.every(x=>x.ok))return alert('This setup is not fully ready yet.');
 const old=stateEngine;
 // Directly build the buy modal from the selected setup instead of relying on state priority.
 const h=hist[type],max=r.close*(1+h.chase),risk=100;
 const stop=type==='normal'?r.low-.5*r.atr:r.close*(1-h.stop);
 const riskPer=Math.max(.01,r.close-stop),qty=Math.max(1,Math.min(Math.floor(3000/r.close),Math.floor(risk/riskPer)));
 $('tradeModalBox').innerHTML=`<div class="setup">Confirm BUY</div><p class="sub">${v.d.grade} — ${v.d.name}</p>
 <label class="lbl">Actual fill price</label><input class="field" id="buyPrice" value="${fmt(r.close)}">
 <label class="lbl">Quantity</label><input class="field" id="buyQty" value="${qty}">
 <div class="row"><div class="lbl">Maximum chase price</div><div class="val">$${fmt(max)}</div></div>
 <div class="row"><div class="lbl">Suggested stop</div><div class="val">$${fmt(stop)}</div></div>
 <div class="actions"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn btn-buy" onclick="confirmBuy('${type}','${v.d.grade}','${v.d.name}',${stop},${max})">CONFIRM BUY</button></div>`;
 $('tradeModal').classList.add('show');
}
function renderPosition(r){
 let type=position.type,h=hist[type],pnl=r?(r.close/position.price-1)*100:null,days=Math.max(0,Math.round((new Date(r.date)-new Date(position.date))/86400000));
 let exit=false,msg='Trade is open. Follow the setup exit rule.';
 if(type==='active'&&r.rsi>=60){exit=true;msg='RSI reached 60 — Active exit area reached.'}
 if(type==='continuation'&&r.reg>=1){exit=true;msg='Regression reached +1.00 — Continuation exit area reached.'}
 if(type==='normal'&&pnl>=5){msg='Normal reached +5% — consider taking half profit.'}
 if(type==='exceptional'&&pnl>=15){msg='Exceptional reached +15% — take half profit and trail the rest.'}
 if((type==='active'&&days>=7)||(type==='continuation'&&days>=10)||(type==='normal'&&days>=10)||(type==='exceptional'&&days>=16)){exit=true;msg='Time-based exit window reached.'}
 $('hero').style.borderColor=exit?'var(--red)':'var(--blue)';
 $('hero').innerHTML=`<div class="state" style="color:${exit?'var(--red)':'var(--blue)'}">${exit?'EXIT':'HOLD'}</div><div class="big">${position.grade} — ${position.name}</div>
 <div class="sub">${position.qty} shares · Entry $${fmt(position.price)} · Current $${fmt(r?.close)} · ${days} calendar days</div>
 <div class="next" style="background:${exit?'#ff5c6718':'#55a7ff18'};border:1px solid ${exit?'var(--red)':'var(--blue)'}"><div class="state" style="color:${exit?'var(--red)':'var(--blue)'}">WHAT'S NEXT</div>${msg}</div>
 <div class="actions"><button class="btn btn-sell" onclick="openSell()">SELL</button></div>`;
 $('setupCard').innerHTML=`<div class="setup">Trade Status</div>
 <div class="row"><div class="lbl">Current gain / loss</div><div class="val" style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pct(pnl)}</div></div>
 <div class="row"><div class="lbl">Dollars invested</div><div class="val">$${fmt(position.price*position.qty)}</div></div>
 <div class="row"><div class="lbl">Current value</div><div class="val">$${fmt((r?.close||position.price)*position.qty)}</div></div>
 <div class="row"><div class="lbl">Stop</div><div class="val">$${fmt(position.stop)}</div></div>
 ${r?barHTML(r.reg,type):''}`;
 $('positionCard').innerHTML=`<div class="setup">Open Position</div><div class="row"><div class="lbl">Bought</div><div class="val">${position.date}</div></div><div class="row"><div class="lbl">Actual fill</div><div class="val">$${fmt(position.price)} × ${position.qty}</div></div>`;
 $('nowGrid').innerHTML=r?metricCard('Current Price',`$${fmt(r.close)}`,`Entry was $${fmt(position.price)}.`,'var(--blue)'):''; $('dataDepth').textContent=''; $('setupList').innerHTML=''; $('dataCard').innerHTML=`<div class="sectionTitle"><span>Data Status</span></div><div class="row"><div class="lbl">Saved daily bars</div><div class="val">${rows.length}</div></div>`;
 renderHistory();
}
function renderHistory(){
 $('historyCard').innerHTML=`<div class="setup">Trade History</div>${trades.length?trades.slice().reverse().slice(0,5).map(t=>`<div class="row"><div><div class="lbl">${t.grade} ${t.name}</div><div class="small">${t.buyDate} → ${t.sellDate}</div></div><div class="val" style="color:${t.pnl>=0?'var(--green)':'var(--red)'}">${pct(t.pnl)}</div></div>`).join(''):'<p class="sub">No completed trades yet.</p>'}`;
}
function openBuy(){
 let r=rows.at(-1),s=stateEngine(r,rows.at(-2)),h=hist[s.type],max=r.close*(1+h.chase),risk=100;
 let stop=s.type==='normal'?r.low-.5*r.atr:r.close*(1-h.stop);
 let riskPer=Math.max(.01,r.close-stop),qty=Math.max(1,Math.min(Math.floor(3000/r.close),Math.floor(risk/riskPer)));
 $('tradeModalBox').innerHTML=`<div class="setup">Confirm BUY</div><p class="sub">${s.grade} — ${s.name}</p>
 <label class="lbl">Actual fill price</label><input class="field" id="buyPrice" value="${fmt(r.close)}">
 <label class="lbl">Quantity</label><input class="field" id="buyQty" value="${qty}">
 <div class="row"><div class="lbl">Maximum chase price</div><div class="val">$${fmt(max)}</div></div>
 <div class="row"><div class="lbl">Suggested stop</div><div class="val">$${fmt(stop)}</div></div>
 <div class="actions"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn btn-buy" onclick="confirmBuy('${s.type}','${s.grade}','${s.name}',${stop},${max})">CONFIRM BUY</button></div>`;
 $('tradeModal').classList.add('show');
}
function confirmBuy(type,grade,name,stop,max){
 let r=rows.at(-1),price=n($('buyPrice').value),qty=Math.floor(n($('buyQty').value)||0);
 if(!price||qty<1)return alert('Enter a valid price and quantity.');
 if(price>max&&!confirm('This fill is above the 3% maximum chase price. Record it anyway?'))return;
 position={type,grade,name,price,qty,stop,date:r.date};
 localStorage.setItem('kri_position',JSON.stringify(position));closeModal();render();
}
function openSell(){
 let r=rows.at(-1);
 $('tradeModalBox').innerHTML=`<div class="setup">Confirm SELL</div><p class="sub">${position.grade} — ${position.name}</p>
 <label class="lbl">Actual sell price</label><input class="field" id="sellPrice" value="${fmt(r.close)}">
 <label class="lbl">Quantity to sell</label><input class="field" id="sellQty" value="${position.qty}">
 <div class="actions"><button class="btn" onclick="closeModal()">CANCEL</button><button class="btn btn-sell" onclick="confirmSell()">CONFIRM SELL</button></div>`;
 $('tradeModal').classList.add('show');
}
function confirmSell(){
 let r=rows.at(-1),price=n($('sellPrice').value),qty=Math.min(position.qty,Math.floor(n($('sellQty').value)||0));if(!price||qty<1)return alert('Enter a valid sell price and quantity.');
 let pnl=(price/position.price-1)*100;trades.push({grade:position.grade,name:position.name,buyDate:position.date,sellDate:r.date,buy:position.price,sell:price,qty,pnl});
 position.qty-=qty;if(position.qty<=0)position=null;
 localStorage.setItem('kri_position',JSON.stringify(position));localStorage.setItem('kri_trades',JSON.stringify(trades));closeModal();render();
}
function closeModal(){$('tradeModal').classList.remove('show')}
$('backHome').addEventListener('click',showHome);
$('historyCsv').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let text=rd.result,lines=String(text||'').split(/\r?\n/).map(v=>v.trim()).filter(Boolean),headerIndex=lines.findIndex(line=>{let q=line.toLowerCase();return q.includes('date')&&q.includes('open')&&q.includes('high')&&q.includes('low')&&(q.includes('close')||q.includes('last'))});if(headerIndex<0)return alert('History file needs Date, Open, High, Low, Close/Last and Volume.');let h=csvCells(lines[headerIndex]),key=names=>h.findIndex(a=>names.some(z=>a.toLowerCase().replace(/\s+/g,'').includes(z.replace(/\s+/g,'')))),ix={date:key(['date']),symbol:key(['symbol','ticker']),open:key(['open']),high:key(['high']),low:key(['low']),close:key(['close','last']),vol:key(['volume','vol']),rsi:key(['rsi']),atr:key(['atr']),ema:key(['ema20']),s50:key(['sma50']),s200:key(['sma200'])};let x=lines.slice(headerIndex+1).map(line=>{let c=csvCells(line),g=i=>i>=0?c[i]:null;return {date:g(ix.date),symbol:ix.symbol>=0?g(ix.symbol):'TQQQ',open:n(g(ix.open)),high:n(g(ix.high)),low:n(g(ix.low)),close:n(g(ix.close)),volume:n(g(ix.vol)),rsi:n(g(ix.rsi)),atr:n(g(ix.atr)),ema20:n(g(ix.ema)),sma50:n(g(ix.s50)),sma200:n(g(ix.s200))}}).filter(r=>r.date&&r.close!=null);if(!x.length)return alert('No valid history rows found.');rows=mergeUploadedRows(rows,x);localStorage.setItem('kri_rows',JSON.stringify(rows));render();alert(`History loaded. ${rows.length} daily rows are now saved.`);e.target.value=''};rd.readAsText(f)});
$('csv').addEventListener('change',e=>{
  let f=e.target.files[0]; if(!f)return;
  let rd=new FileReader();
  rd.onload=()=>{
    let x=parseCSV(rd.result,f.name);
    if(!x.length) return alert('I could not read this TOS Quote file. I need Symbol, Last, Open, High and Low. The date can come from the filename.');
    rows=mergeUploadedRows(rows,x);
    localStorage.setItem('kri_rows',JSON.stringify(rows));
    render();
    const d=x[x.length-1].date, sym=x[x.length-1].symbol||'TQQQ';
    alert(`${sym} ${d} loaded successfully. ${rows.length} daily row${rows.length===1?'':'s'} saved in the app.`);
    e.target.value='';
  };
  rd.readAsText(f);
});
$('tradeModal').addEventListener('click',e=>{if(e.target===$('tradeModal'))closeModal()});
currentScreen='home';
render();
</script>
