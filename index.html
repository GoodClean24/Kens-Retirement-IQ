<style>

}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}.app{max-width:980px;margin:0 auto;min-height:100vh}.header{padding:18px 18px 14px;border-bottom:1px solid var(--border);background:#0d1118;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:14px;align-items:center}.brand{font-size:26px;font-weight:1000;letter-spacing:-.03em}.brand span{color:var(--green)}.tag{color:var(--sub);font-size:12px;margin-top:2px}.priceBox{text-align:right}.ticker{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.08em}.price{font-size:28px;font-weight:1000;line-height:1.05}.move{font-size:12px;font-weight:900;margin-top:3px}.toolbar{padding:10px 18px;border-bottom:1px solid var(--border);background:#0b0f15;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:77px;z-index:9}.dataState{font-size:12px;color:var(--sub);font-weight:800}.buttons{display:flex;gap:7px;flex-wrap:wrap}input[type=file]{display:none}.fileBtn{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:950;cursor:pointer;border:1px solid var(--border)}.fileBtn.history{background:#151b25;color:var(--sub)}.fileBtn.live{background:#27311c;color:#f5ffea;border-color:#596b31}.fileBtn.final{background:var(--green);color:#04110a;border-color:transparent}.wrap{padding:18px 16px 60px}.liveBanner{border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.4}.liveBanner.live{background:#2b2510;border-color:#675a27}.liveBanner.final{background:#0d2a19;border-color:#1e6e42}.liveBanner b{font-size:13px}.hero{border-radius:22px;padding:20px;border:2px solid var(--border);background:var(--panel);margin-bottom:14px}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.09em;color:var(--muted)}.decision{font-size:34px;font-weight:1000;letter-spacing:-.03em;margin:4px 0}.setupName{font-size:18px;font-weight:950;margin-top:2px}.decisionText{font-size:15px;line-height:1.5;color:var(--sub);margin-top:7px;max-width:760px}.heroMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid var(--border);background:var(--panel3);border-radius:10px;padding:8px 10px;font-size:12px;font-weight:900}.section{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px}.sectionTitle{font-size:18px;font-weight:1000;margin-bottom:3px}.sectionSub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.4}.checkGrid{display:grid;gap:9px}.check{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel3);border:1px solid var(--border);border-radius:13px;padding:11px 12px}.checkTitle{font-size:14px;font-weight:900}.checkNow{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.35}.pill{font-size:11px;font-weight:1000;padding:6px 8px;border-radius:8px;white-space:nowrap}.pill.ok{background:#1b6a3b33;color:var(--green)}.pill.wait{background:#806b1733;color:var(--yellow)}.pill.no{background:#7f273033;color:var(--red)}.tosCard{background:#0b1219;border:1px solid #31445f;border-radius:14px;padding:14px;margin-top:12px}.tosTitle{font-size:15px;font-weight:1000;margin-bottom:7px}.tosStep{display:grid;grid-template-columns:28px 1fr;gap:9px;margin:9px 0;align-items:start}.num{width:28px;height:28px;border-radius:50%;background:#1b2635;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:12px}.tosStep b{display:block;font-size:13px}.tosStep span{display:block;color:var(--sub);font-size:12px;line-height:1.35;margin-top:2px}.playbookRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--panel3);border:1px solid var(--border);border-radius:14px;padding:13px;margin-top:9px}.playbookRow.active{border-color:var(--blue)}.playbookRow h3{margin:0;font-size:16px}.playbookRow p{margin:4px 0 0;color:var(--sub);font-size:12px;line-height:1.35}.statusTag{font-size:11px;font-weight:1000;padding:6px 8px;border-radius:8px}.positionHero{background:#0c1b2a;border:1px solid #3f8ed7;border-radius:18px;padding:16px}.positionTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.positionTitle{font-size:22px;font-weight:1000}.positionState{font-size:12px;font-weight:1000;padding:6px 8px;border-radius:8px}.positionGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.stat{background:#111b28;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:var(--muted)}.actionText{margin-top:12px;background:#0a1119;border:1px solid var(--border);border-radius:12px;padding:11px;font-size:13px;line-height:1.4}.actions{display:flex;gap:8px;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:1000;cursor:pointer}.btn.buy{background:var(--green);color:#04110a}.btn.sell{background:var(--red);color:#1a0508}.btn.secondary{background:#1b2230;color:#fff;border:1px solid var(--border)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}.modalBox{width:min(460px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:20px}.modalTitle{font-size:20px;font-weight:1000}.fieldLabel{font-size:12px;color:var(--sub);font-weight:900;margin-top:12px}.field{width:100%;margin-top:5px;background:#0b1017;border:1px solid var(--border);color:#fff;border-radius:11px;padding:12px;font-size:17px}.tiny{font-size:11px;color:var(--muted);line-height:1.4}.twoCol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:26px;text-align:center;color:var(--sub)}
@media(max-width:650px){.decision{font-size:30px}.header{padding:14px 14px 12px}.toolbar{top:72px;padding:9px 14px}.wrap{padding:14px 12px 48px}.positionGrid{grid-template-columns:1fr 1fr}.twoCol{grid-template-columns:1fr}.fileBtn{padding:9px 10px}.price{font-size:24px}}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div><div class="brand">Ken's Retirement <span>IQ</span></div><div class="tag">Simple TQQQ swing-trade guide</div></div>
    <div class="priceBox" id="topPrice"><div class="ticker">TQQQ</div><div class="price">—</div><div class="move">No data</div></div>
  </header>

  <div class="toolbar">
    <div class="dataState" id="dataState">NO DATA</div>
    <div class="buttons">
      <label class="fileBtn history" for="historyCsv">Load History</label><input id="historyCsv" type="file" accept=".csv,text/csv"/>
      <label class="fileBtn live" for="liveCsv">Update Live</label><input id="liveCsv" type="file" accept=".csv,text/csv"/>
      <label class="fileBtn final" for="finalCsv">Final Daily Upload</label><input id="finalCsv" type="file" accept=".csv,text/csv"/>
    </div>
  </div>

  <main class="wrap">
    <div id="liveBanner"></div>
    <div id="positionArea"></div>
    <div id="decisionArea"></div>
    <div id="detailsArea"></div>
  </main>
</div>

<div class="modal" id="tradeModal"><div class="modalBox" id="tradeModalBox"></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY_ROWS='kri3_rows',KEY_LIVE='kri3_live',KEY_POS='kri3_position',KEY_TRADES='kri3_trades';
let rows=JSON.parse(localStorage.getItem(KEY_ROWS)||'[]');
let liveRow=JSON.parse(localStorage.getItem(KEY_LIVE)||'null');
let position=JSON.parse(localStorage.getItem(KEY_POS)||'null');
let trades=JSON.parse(localStorage.getItem(KEY_TRADES)||'[]');

function n(v){let x=parseFloat(String(v??'').replace(/[$,%]/g,'').replace(/,/g,''));return Number.isFinite(x)?x:null}
function fmt(v,d=2){return v==null?'—':Number(v).toFixed(d)}
function pct(v,d=1){return v==null?'—':Number(v).toFixed(d)+'%'}
function mean(a){a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function ema(vals,len){let a=2/(len+1),out=[];vals.forEach((v,i)=>out.push(i? a*v+(1-a)*out[i-1]:v));return out}
function sma(vals,len,i){if(i<len-1)return null;return mean(vals.slice(i-len+1,i+1))}
function wilder(vals,len){let out=[];for(let i=0;i<vals.length;i++){if(i===0)out[i]=vals[i]||0;else out[i]=((out[i-1]*(len-1))+(vals[i]||0))/len}return out}
function calcRSI(closes,len=14){let d=closes.map((v,i)=>i?v-closes[i-1]:0),g=d.map(x=>Math.max(x,0)),l=d.map(x=>Math.max(-x,0)),ag=wilder(g,len),al=wilder(l,len);return closes.map((_,i)=>al[i]===0?100:100-(100/(1+ag[i]/al[i])))}
function csvCells(line){return String(line).split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(x=>x.trim().replace(/^\"|\"$/g,''))}
function dateFromFileName(fileName,txt){const m=String(fileName||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;const q=String(txt||'').match(/Quote on\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i);if(q){let yy=parseInt(q[3],10);if(yy<100)yy+=2000;return `${yy}-${String(q[1]).padStart(2,'0')}-${String(q[2]).padStart(2,'0')}`}return null}
function parseCSV(txt,fileName){
 const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return [];
 const headerIndex=lines.findIndex(line=>{const low=line.toLowerCase();return low.includes('symbol')&&low.includes('open')&&low.includes('high')&&low.includes('low')&&(low.includes('last')||low.includes('close'))});if(headerIndex<0)return [];
 const h=csvCells(lines[headerIndex]),key=names=>h.findIndex(x=>names.some(z=>x.toLowerCase().replace(/\s+/g,'').includes(z.replace(/\s+/g,''))));
 const ix={date:key(['date']),symbol:key(['symbol','ticker']),open:key(['open']),high:key(['high']),low:key(['low']),close:key(['close','last']),vol:key(['volume','vol']),rsi:key(['rsi14','rsi']),atr:key(['atr14','atr']),ema:key(['ema20']),s50:key(['sma50']),s200:key(['sma200']),avgvol:key(['avgvol20','averagevolume20'])};
 const fallbackDate=dateFromFileName(fileName,txt);
 return lines.slice(headerIndex+1).map(line=>{let c=csvCells(line),g=i=>i>=0?c[i]:null;return {date:ix.date>=0?g(ix.date):fallbackDate,symbol:ix.symbol>=0?g(ix.symbol):'TQQQ',open:n(g(ix.open)),high:n(g(ix.high)),low:n(g(ix.low)),close:n(g(ix.close)),volume:n(g(ix.vol)),rsi:n(g(ix.rsi)),atr:n(g(ix.atr)),ema20:n(g(ix.ema)),sma50:n(g(ix.s50)),sma200:n(g(ix.s200)),avgVol20:n(g(ix.avgvol))}}).filter(r=>r.date&&r.close!=null&&(!r.symbol||String(r.symbol).toUpperCase().includes('TQQQ'))).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function parseHistory(txt){
 const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return [];
 const headerIndex=lines.findIndex(line=>{let q=line.toLowerCase();return q.includes('date')&&q.includes('open')&&q.includes('high')&&q.includes('low')&&(q.includes('close')||q.includes('last'))});if(headerIndex<0)return [];
 const h=csvCells(lines[headerIndex]),key=names=>h.findIndex(x=>names.some(z=>x.toLowerCase().replace(/\s+/g,'').includes(z.replace(/\s+/g,''))));
 const ix={date:key(['date']),symbol:key(['symbol','ticker']),open:key(['open']),high:key(['high']),low:key(['low']),close:key(['close','last']),vol:key(['volume','vol']),rsi:key(['rsi14','rsi']),atr:key(['atr14','atr']),ema:key(['ema20']),s50:key(['sma50']),s200:key(['sma200']),avgvol:key(['avgvol20','averagevolume20'])};
 return lines.slice(headerIndex+1).map(line=>{let c=csvCells(line),g=i=>i>=0?c[i]:null;return {date:g(ix.date),symbol:ix.symbol>=0?g(ix.symbol):'TQQQ',open:n(g(ix.open)),high:n(g(ix.high)),low:n(g(ix.low)),close:n(g(ix.close)),volume:n(g(ix.vol)),rsi:n(g(ix.rsi)),atr:n(g(ix.atr)),ema20:n(g(ix.ema)),sma50:n(g(ix.s50)),sma200:n(g(ix.s200)),avgVol20:n(g(ix.avgvol))}}).filter(r=>r.date&&r.close!=null&&(!r.symbol||String(r.symbol).toUpperCase().includes('TQQQ'))).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function mergeRows(base,incoming){const m=new Map();(base||[]).forEach(r=>r?.date&&m.set(r.date,r));(incoming||[]).forEach(r=>r?.date&&m.set(r.date,{...(m.get(r.date)||{}),...r}));return [...m.values()].sort((a,b)=>new Date(a.date)-new Date(b.date))}
function enrich(rs){
 const c=rs.map(r=>r.close),e20=ema(c,20),rsi14=calcRSI(c,14);const trs=rs.map((q,j)=>j?Math.max(q.high-q.low,Math.abs(q.high-c[j-1]),Math.abs(q.low-c[j-1])):q.high-q.low),atr14=wilder(trs,14);
 return rs.map((r,i)=>{const avPrev20=i>=20?mean(rs.slice(i-20,i).map(x=>x.volume)):null;const high252=i>=251?Math.max(...rs.slice(i-251,i+1).map(x=>x.high)):Math.max(...rs.slice(0,i+1).map(x=>x.high));return {...r,ema20:r.ema20??e20[i],sma50:r.sma50??sma(c,50,i),sma200:r.sma200??sma(c,200,i),rsi:r.rsi??rsi14[i],atr:r.atr??atr14[i],atrPct:(r.atr??atr14[i])/r.close*100,avgVol20:r.avgVol20??avPrev20,volRatio:(r.avgVol20??avPrev20)?r.volume/(r.avgVol20??avPrev20):null,emaSlope5:i>=5?((r.ema20??e20[i])/(rs[i-5].ema20??e20[i-5])-1)*100:null,pullback5:i>=5?(r.close/c[i-5]-1)*100:null,distEma:r.ema20!=null||e20[i]!=null?(r.close/(r.ema20??e20[i])-1)*100:null,distSma50:r.sma50!=null||sma(c,50,i)!=null?(r.close/(r.sma50??sma(c,50,i))-1)*100:null,high252,pctFromHigh:high252?(r.close/high252-1)*100:null};});
}
function viewRows(){let base=rows.slice();if(liveRow){base=mergeRows(base,[liveRow])}return enrich(base)}
function isFinalToday(){if(!rows.length)return false;const last=rows.at(-1);return !liveRow && !!last}
function activeSource(){if(liveRow)return 'live';return rows.length?'final':'none'}
function currentAndPrev(){const vr=viewRows();return {vr,r:vr.at(-1),prev:vr.at(-2),i:vr.length-1}}
function daysSinceEntry(vr,date){const idx=vr.findIndex(x=>x.date===date);return idx<0?null:Math.max(1,vr.length-idx)}

function trendResetState(vr,r,i,mode){
 if(!r||i<20)return {name:'Trend Reset',status:'WAIT',score:0,checks:[],next:'Load more history.'};
 const checks=[
  {label:'20 EMA is rising',ok:r.emaSlope5!=null&&r.emaSlope5>0,now:`20 EMA change: ${pct(r.emaSlope5)}`,watch:'On TOS, the 20 EMA should be pointing upward.'},
  {label:'TQQQ pulled back recently',ok:r.pullback5!=null&&r.pullback5<0,now:`5-day move: ${pct(r.pullback5)}`,watch:'Price should have backed off instead of racing straight up.'},
  {label:'Price is near the 20 EMA',ok:r.distEma!=null&&r.distEma>=-0.5&&r.distEma<=2.0,now:`Price vs 20 EMA: ${pct(r.distEma)}`,watch:'Price should be close to the 20 EMA, not far above or clearly below it.'},
  {label:'Volatility is strong enough',ok:r.atrPct!=null&&r.atrPct>=3,now:`ATR: ${pct(r.atrPct)}`,watch:'This simply tells us TQQQ is moving enough to make the trade worthwhile.'}
 ];
 const volOk=r.volRatio!=null&&r.volRatio>=1.0;
 checks.push({label:'Volume confirms the move',ok:mode==='live'?null:volOk,now:`Volume: ${r.volRatio==null?'—':fmt(r.volRatio,2)+'× normal'}`,watch:mode==='live'?'Volume is still building. Final volume is judged after the close.':'Final volume should be at least normal.'});
 const hard=checks.slice(0,4).every(c=>c.ok===true),allFinal=hard&&volOk;
 let status='WAIT',next='This setup is not close enough yet.';
 if(mode==='final'&&allFinal){status='BUY';next='Trend Reset is confirmed. Historical entry was the next session open.'}
 else if(mode==='live'&&hard){status='READY IF CLOSE HOLDS';next='The price setup is lined up. Final volume still has to confirm at the close.'}
 else{
   const nearEma=r.distEma!=null&&r.distEma>=-1.25&&r.distEma<=3.0;
   const nearPull=r.pullback5!=null&&r.pullback5<1.5;
   const structure=(r.emaSlope5||0)>-0.4&&nearEma&&nearPull;
   if(structure){status='GETTING CLOSE';const miss=checks.find(c=>c.ok===false);next=miss?`Waiting for: ${miss.label}.`:'The setup is developing.'}
 }
 return {name:'Trend Reset',status,checks,next};
}
function deepRecoveryState(vr,r,i,mode){
 if(!r||i<60)return {name:'Deep Recovery',status:'WAIT',checks:[],next:'Load more history.'};
 const recent=vr.slice(Math.max(0,i-19),i+1);const deepest=Math.min(...recent.map(x=>x.pctFromHigh??0));const washout=deepest<=-22;
 const prev=vr[i-1];const reclaim=!!(prev&&prev.sma50!=null&&prev.close<=prev.sma50&&r.sma50!=null&&r.close>r.sma50);
 const near50=r.distSma50!=null&&r.distSma50>=-2&&r.distSma50<=1.5;
 const volControlled=r.volRatio!=null&&r.volRatio<=0.95;
 const checks=[
  {label:'A big washout happened recently',ok:washout,now:`Deepest recent drop: ${pct(deepest)}`,watch:'On TOS, this should look like a real selloff, not a small dip.'},
  {label:'Price is reclaiming the 50 SMA',ok:mode==='live'?(r.sma50!=null&&r.close>r.sma50):reclaim,now:`Price vs 50 SMA: ${pct(r.distSma50)}`,watch:'Watch the 50 SMA. TQQQ needs to move back above it.'},
  {label:'Reclaim volume stays controlled',ok:mode==='live'?null:volControlled,now:`Volume: ${r.volRatio==null?'—':fmt(r.volRatio,2)+'× normal'}`,watch:mode==='live'?'Do not judge this volume until the day is complete.':'We prefer the reclaim without unusually heavy volume.'}
 ];
 let status='WAIT',next='No Deep Recovery setup right now.';
 if(mode==='final'&&washout&&reclaim&&volControlled){status='BUY';next='Deep Recovery is confirmed. Historical entry was the next session open.'}
 else if(mode==='live'&&washout&&r.sma50!=null&&r.close>r.sma50){status='WATCH THE 50 SMA';next='TQQQ is above the 50 SMA right now. It must still be above it at the close.'}
 else if(washout&&near50){status='GETTING CLOSE';next='Watch the 50 SMA. TQQQ is close to a possible recovery reclaim.'}
 return {name:'Deep Recovery',status,checks,next};
}
function chooseDecision(a,b,mode){
 const rank={'BUY':6,'READY IF CLOSE HOLDS':5,'WATCH THE 50 SMA':5,'GETTING CLOSE':4,'WAIT':1};
 let best=rank[a.status]>=rank[b.status]?a:b;
 if(a.status==='BUY'&&b.status==='BUY')best=a;
 let title='WAIT',text='No good setup right now. Let TQQQ come to us.',color='var(--muted)';
 if(best.status==='BUY'){title='BUY NEXT SESSION';text=best.next;color='var(--green)'}
 else if(best.status==='READY IF CLOSE HOLDS'){title='READY IF CLOSE HOLDS';text=best.next;color='var(--yellow)'}
 else if(best.status==='WATCH THE 50 SMA'){title='WATCH THE 50 SMA';text=best.next;color='var(--yellow)'}
 else if(best.status==='GETTING CLOSE'){title='GETTING CLOSE';text=best.next;color='var(--blue)'}
 return {...best,title,text,color};
}
function statusTag(s){if(s==='BUY')return ['BUY','var(--green)'];if(s==='READY IF CLOSE HOLDS'||s==='WATCH THE 50 SMA')return [s,'var(--yellow)'];if(s==='GETTING CLOSE')return [s,'var(--blue)'];return ['WAIT','var(--muted)']}
function tosSteps(type){
 if(type==='Trend Reset')return [
  ['Find the 20 EMA','This is the faster trend line.'],
  ['Check the direction','The 20 EMA should be pointing upward.'],
  ['Watch price come back toward it','We want a pullback toward the 20 EMA, not a big breakdown.'],
  ['Look for price to hold near the line','If price stays near or just above the 20 EMA into the close, the setup may be ready.']
 ];
 return [
  ['Find the 50 SMA','This is the recovery line for this setup.'],
  ['Look back at the recent selloff','TQQQ should have had a real drop from its recent high.'],
  ['Watch price move back above the 50 SMA','An intraday move above is only an attempt.'],
  ['Make sure it finishes above the line','The app will only confirm the setup after the final daily upload.']
 ];
}
function render(){
 const {vr,r,prev,i}=currentAndPrev();const mode=activeSource();
 const change=r&&prev?((r.close/prev.close)-1)*100:null;
 $('topPrice').innerHTML=r?`<div class="ticker">TQQQ</div><div class="price">$${fmt(r.close)}</div><div class="move" style="color:${change>=0?'var(--green)':'var(--red)'}">${change>=0?'+':''}${pct(change)}</div>`:`<div class="ticker">TQQQ</div><div class="price">—</div><div class="move">No data</div>`;
 $('dataState').textContent=r?`${r.date} · ${mode==='live'?'LIVE UPDATE':'DAY COMPLETE'} · ${rows.length} completed bars`:'NO DATA';
 $('liveBanner').innerHTML=mode==='live'?`<div class="liveBanner live"><b>LIVE — DAY STILL IN PROGRESS</b><br>These numbers can change before the close. The app will not confirm a Buy until the Final Daily Upload.</div>`:mode==='final'?`<div class="liveBanner final"><b>DAY COMPLETE</b><br>Today's completed bar is final and can confirm a setup.</div>`:'';
 if(!r){$('decisionArea').innerHTML=`<div class="section empty">Load TQQQ history to begin.</div>`;$('detailsArea').innerHTML='';return}
 if(position){renderPosition(vr,r);return}else $('positionArea').innerHTML='';
 const a=trendResetState(vr,r,i,mode),b=deepRecoveryState(vr,r,i,mode),d=chooseDecision(a,b,mode);
 $('decisionArea').innerHTML=`<div class="hero" style="border-color:${d.color}"><div class="eyebrow">TODAY'S ANSWER</div><div class="decision" style="color:${d.color}">${d.title}</div><div class="setupName">${d.name}</div><div class="decisionText">${d.text}</div><div class="heroMeta"><div class="chip">${mode==='live'?'Live data':'Final daily data'}</div><div class="chip">Signal version: v1.0</div>${d.status==='BUY'?`<button class="btn buy" onclick="openBuy('${d.name}')">RECORD BUY</button>`:''}</div></div>`;
 const [ta,ca]=statusTag(a.status),[tb,cb]=statusTag(b.status);
 $('detailsArea').innerHTML=`
 <div class="section"><div class="sectionTitle">What Dad should watch on Thinkorswim</div><div class="sectionSub">The app gives the decision. The chart helps him see why.</div><div class="tosCard"><div class="tosTitle">${d.name}</div>${tosSteps(d.name).map((x,k)=>`<div class="tosStep"><div class="num">${k+1}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div></div>
 <div class="section"><div class="sectionTitle">Today's setup</div><div class="sectionSub">Only the setup that matters most needs Dad's attention.</div>${d.checks.map(c=>`<div class="check"><div><div class="checkTitle">${c.label}</div><div class="checkNow">${c.now}<br>${c.watch}</div></div><div class="pill ${c.ok===true?'ok':c.ok===false?'no':'wait'}">${c.ok===true?'READY':c.ok===false?'NOT YET':'WAIT FOR CLOSE'}</div></div>`).join('')}</div>
 <div class="section"><div class="sectionTitle">The two playbooks</div><div class="sectionSub">Different market situations. The app chooses which one matters today.</div>
   <div class="playbookRow ${d.name==='Trend Reset'?'active':''}"><div><h3>Trend Reset</h3><p>Healthy uptrend, short pullback toward the rising 20 EMA, then rebound.</p></div><div class="statusTag" style="color:${ca};background:color-mix(in srgb, ${ca} 18%, transparent)">${ta}</div></div>
   <div class="playbookRow ${d.name==='Deep Recovery'?'active':''}"><div><h3>Deep Recovery</h3><p>Major selloff, then TQQQ repairs the damage and moves back above the 50 SMA.</p></div><div class="statusTag" style="color:${cb};background:color-mix(in srgb, ${cb} 18%, transparent)">${tb}</div></div>
 </div>`;
}
function renderPosition(vr,r){
 $('decisionArea').innerHTML='';$('detailsArea').innerHTML='';
 const pnl=(r.close/position.price-1)*100,day=daysSinceEntry(vr,position.signalDate||position.date)||1;
 const isTrend=position.playbook==='Trend Reset',maxDays=isTrend?7:10,profitZone=pnl>=6,runner=!isTrend&&pnl>=10;
 let state='HOLD',color='var(--blue)',msg=isTrend?'Trend Reset usually works over about 5–7 trading days.':'Deep Recovery usually needs more time — about 8–10 trading days.';
 if(pnl<=-6){state='SELL / STOP AREA';color='var(--red)';msg='The trade has reached the emergency loss area. Do not turn a trade into a hope.'}
 else if(day>=maxDays){state='DECISION DAY';color='var(--yellow)';msg='The normal hold window has been reached. Review the chart and protect the trade.'}
 else if(runner){state='RUNNER';color='var(--green)';msg='Deep Recovery is in runner territory. Protect profit, but do not automatically cap a strong recovery.'}
 else if(profitZone){state='PROFIT PROVEN';color='var(--green)';msg='The trade reached the +6% profit checkpoint. This is a decision point, not an automatic sell.'}
 $('positionArea').innerHTML=`<div class="positionHero"><div class="positionTop"><div><div class="eyebrow">YOU OWN TQQQ</div><div class="positionTitle">${position.playbook}</div></div><div class="positionState" style="color:${color};background:color-mix(in srgb, ${color} 18%, transparent)">${state}</div></div><div class="positionGrid"><div class="stat"><b>$${fmt(position.price)}</b><span>bought</span></div><div class="stat"><b>$${fmt(r.close)}</b><span>now</span></div><div class="stat"><b style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl>=0?'+':''}${pct(pnl)}</b><span>gain / loss</span></div><div class="stat"><b>${day}</b><span>trading day of ~${maxDays}</span></div></div><div class="actionText"><b>What to do:</b> ${msg}</div><div class="actions"><button class="btn sell" onclick="openSell()">RECORD SELL</button></div></div>`;
 const steps=tosSteps(position.playbook);
 $('detailsArea').innerHTML=`<div class="section"><div class="sectionTitle">What Dad should watch now</div><div class="sectionSub">Use the same line that created the trade.</div><div class="tosCard"><div class="tosTitle">${position.playbook}</div>${steps.map((x,k)=>`<div class="tosStep"><div class="num">${k+1}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div></div>`;
}
function openBuy(playbook){
 const {r}=currentAndPrev();if(activeSource()!=='final')return alert('A Buy can only be confirmed from the Final Daily Upload.');
 $('tradeModalBox').innerHTML=`<div class="modalTitle">Record BUY</div><div class="tiny">${playbook} · Enter the actual fill from the next trading session.</div><div class="fieldLabel">Actual fill price</div><input class="field" id="buyPrice" value="${fmt(r.close)}"><div class="fieldLabel">Shares</div><input class="field" id="buyQty" value="1"><div class="tiny" style="margin-top:8px">Emergency stop reference: about 6% below the actual fill. The app will track the trade using the playbook that created it.</div><div class="actions"><button class="btn secondary" onclick="closeModal()">CANCEL</button><button class="btn buy" onclick="confirmBuy('${playbook}')">SAVE BUY</button></div>`;$('tradeModal').classList.add('show');
}
function confirmBuy(playbook){const {r}=currentAndPrev();const price=n($('buyPrice').value),qty=Math.floor(n($('buyQty').value)||0);if(!price||qty<1)return alert('Enter a valid fill price and share quantity.');position={playbook,price,qty,date:r.date,signalDate:r.date,ruleVersion:'v1.0'};localStorage.setItem(KEY_POS,JSON.stringify(position));closeModal();render()}
function openSell(){const {r}=currentAndPrev();$('tradeModalBox').innerHTML=`<div class="modalTitle">Record SELL</div><div class="tiny">Enter the actual sell price.</div><div class="fieldLabel">Actual sell price</div><input class="field" id="sellPrice" value="${fmt(r.close)}"><div class="fieldLabel">Shares to sell</div><input class="field" id="sellQty" value="${position.qty}"><div class="actions"><button class="btn secondary" onclick="closeModal()">CANCEL</button><button class="btn sell" onclick="confirmSell()">SAVE SELL</button></div>`;$('tradeModal').classList.add('show')}
function confirmSell(){const {r}=currentAndPrev();const price=n($('sellPrice').value),qty=Math.min(position.qty,Math.floor(n($('sellQty').value)||0));if(!price||qty<1)return alert('Enter a valid sell price and share quantity.');const pnl=(price/position.price-1)*100;trades.push({playbook:position.playbook,buyDate:position.date,sellDate:r.date,buy:position.price,sell:price,qty,pnl,ruleVersion:position.ruleVersion});position.qty-=qty;if(position.qty<=0)position=null;localStorage.setItem(KEY_POS,JSON.stringify(position));localStorage.setItem(KEY_TRADES,JSON.stringify(trades));closeModal();render()}
function closeModal(){$('tradeModal').classList.remove('show')}
function handleHistory(file){const rd=new FileReader();rd.onload=()=>{const x=parseHistory(rd.result);if(!x.length)return alert('History file needs Date, Open, High, Low, Close/Last and Volume.');rows=mergeRows(rows,x);localStorage.setItem(KEY_ROWS,JSON.stringify(rows));render();alert(`History loaded. ${rows.length} completed daily bars are saved.`)};rd.readAsText(file)}
function handleLive(file){const rd=new FileReader();rd.onload=()=>{const x=parseCSV(rd.result,file.name);if(!x.length)return alert('I could not read this TQQQ TOS file.');liveRow=x.at(-1);localStorage.setItem(KEY_LIVE,JSON.stringify(liveRow));render();alert(`${liveRow.date} live TQQQ update loaded. This does NOT confirm a Buy.`)};rd.readAsText(file)}
function handleFinal(file){const rd=new FileReader();rd.onload=()=>{const x=parseCSV(rd.result,file.name);if(!x.length)return alert('I could not read this TQQQ TOS file.');const final=x.at(-1);rows=mergeRows(rows,[final]);liveRow=null;localStorage.setItem(KEY_ROWS,JSON.stringify(rows));localStorage.removeItem(KEY_LIVE);render();alert(`${final.date} saved as the FINAL daily bar. The app can now confirm or reject today's setup.`)};rd.readAsText(file)}
$('historyCsv').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleHistory(f);e.target.value=''})
$('liveCsv').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleLive(f);e.target.value=''})
$('finalCsv').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFinal(f);e.target.value=''})
$('tradeModal').addEventListener('click',e=>{if(e.target===$('tradeModal'))closeModal()})
render();
</script>
</body>
</html>
