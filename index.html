.playbookAccordion{border:1px solid var(--border);border-radius:18px;background:var(--panel);margin-top:14px;overflow:hidden}.playbookAccordion[open]{border-color:#3a465b}.playbookSummary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.playbookSummary::-webkit-details-marker{display:none}.playbookSummary h3{margin:0;font-size:19px}.playbookSummary p{margin:4px 0 0;color:var(--sub);font-size:12px;line-height:1.4}.accordionRight{display:flex;align-items:center;gap:9px}.chev{font-size:20px;color:var(--muted);transition:.15s}.playbookAccordion[open] .chev{transform:rotate(90deg)}.accordionBody{border-top:1px solid var(--border);padding:16px}.subSectionTitle{font-size:14px;font-weight:1000;margin:0 0 9px}.comparison{border:1px solid var(--border);border-radius:14px;overflow:hidden}.comparisonHead,.comparisonRow{display:grid;grid-template-columns:minmax(220px,1.25fr) minmax(180px,1fr) minmax(210px,1.05fr) 112px;column-gap:18px;align-items:center}.comparisonHead{background:#18212d;padding:9px 18px;color:var(--muted);font-size:10px;font-weight:950;letter-spacing:.06em}.comparisonRow{padding:12px 18px;border-top:1px solid var(--border)}.comparisonRow:first-of-type{border-top:0}.comparisonHead>div,.comparisonRow>div{display:block;width:100%;text-align:left!important;justify-self:stretch!important}.compLabel{font-size:13px;font-weight:900}.compTarget{font-size:12px;color:#8fd0ff;font-weight:850}.compToday{font-size:12px;color:#fff;font-weight:850}.compStatus{font-size:10px;font-weight:1000;padding:5px 7px;border-radius:8px;width:max-content!important;justify-self:start!important}.compStatus.ok{color:var(--green);background:#1b6a3b33}.compStatus.no{color:var(--red);background:#7f273033}.compStatus.wait{color:var(--yellow);background:#806b1733}.proofCard{margin-top:16px;border:1px solid var(--border);border-radius:15px;background:#10151e;padding:15px 16px}.proofEyebrow{font-size:10px;font-weight:950;letter-spac <script>
const $=id=>document.getElementById(id);
const KEY_ROWS='kri3_rows',KEY_LIVE='kri3_live',KEY_POS='kri3_position',KEY_TRADES='kri3_trades',KEY_SIGNALS='kri3_signals';
const STARTING_ACCOUNT=3000,MAX_TRADE_DOLLARS=1000,EMERGENCY_STOP_PCT=0.06,APP_VERSION='MASTER-1.2';
let rows=JSON.parse(localStorage.getItem(KEY_ROWS)||'[]');
let liveRow=JSON.parse(localStorage.getItem(KEY_LIVE)||'null');
let position=JSON.parse(localStorage.getItem(KEY_POS)||'null');
let trades=JSON.parse(localStorage.getItem(KEY_TRADES)||'[]');
let signals=JSON.parse(localStorage.getItem(KEY_SIGNALS)||'[]');

function n(v){let x=parseFloat(String(v??'').replace(/[$,%]/g,'').replace(/,/g,''));return Number.isFinite(x)?x:null}
function fmt(v,d=2){return v==null?'—':Number(v).toFixed(d)}
function pct(v,d=1){return v==null?'—':Number(v).toFixed(d)+'%'}
function mean(a){a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function ema(vals,len){let a=2/(len+1),out=[];vals.forEach((v,i)=>out.push(i? a*v+(1-a)*out[i-1]:v));return out}
function sma(vals,len,i){if(i<len-1)return null;return mean(vals.slice(i-len+1,i+1))}
function wilder(vals,len){const out=Array(vals.length).fill(null);if(vals.length<len)return out;const seed=mean(vals.slice(0,len));out[len-1]=seed;for(let i=len;i<vals.length;i++)out[i]=((out[i-1]*(len-1))+(vals[i]||0))/len;return out}
function calcRSI(closes,len=14){let d=closes.map((v,i)=>i?v-closes[i-1]:0),g=d.map(x=>Math.max(x,0)),l=d.map(x=>Math.max(-x,0)),ag=wilder(g,len),al=wilder(l,len);return closes.map((_,i)=>ag[i]==null||al[i]==null?null:(al[i]===0?100:100-(100/(1+ag[i]/al[i]))))}
function csvCells(line){return String(line).split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/).map(x=>x.trim().replace(/^\"|\"$/g,''))}
function dateFromFileName(fileName,txt){const m=String(fileName||'').match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return `${m[1]}-${m[2]}-${m[3]}`;const q=String(txt||'').match(/Quote on\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/i);if(q){let yy=parseInt(q[3],10);if(yy<100)yy+=2000;return `${yy}-${String(q[1]).padStart(2,'0')}-${String(q[2]).padStart(2,'0')}`}return null}
function parseCSV(txt,fileName){
 const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return [];
 const headerIndex=lines.findIndex(line=>{const low=line.toLowerCase();return low.includes('symbol')&&low.includes('open')&&low.includes('high')&&low.includes('low')&&(low.includes('last')||low.includes('close'))});if(headerIndex<0)return [];
 const h=csvCells(lines[headerIndex]),key=names=>h.findIndex(x=>names.some(z=>x.toLowerCase().replace(/\s+/g,'').includes(z.replace(/\s+/g,''))));
 const ix={date:key(['date']),symbol:key(['symbol','ticker']),open:key(['open']),high:key(['high']),low:key(['low']),close:key(['close','last']),vol:key(['volume','vol']),rsi:key(['rsi14','rsi']),atr:key(['atr14','atr']),ema:key(['ema20']),s50:key(['sma50']),s200:key(['sma200']),avgvol:key(['avgvol20','averagevolume20'])};
 const fallbackDate=dateFromFileName(fileName,txt);
 return lines.slice(headerIndex+1).map(line=>{let c=csvCells(line),g=i=>i>=0?c[i]:null;return {date:ix.date>=0?g(ix.date):fallbackDate,symbol:ix.symbol>=0?g(ix.symbol):'TQQQ',open:n(g(ix.open)),high:n(g(ix.high)),low:n(g(ix.low)),close:n(g(ix.close)),volume:n(g(ix.vol)),rsi:n(g(ix.rsi)),atr:n(g(ix.atr)),ema20:n(g(ix.ema)),sma50:n(g(ix.s50)),sma200:n(g(ix.s200)),avgVol20:n(g(ix.avgvol))}}).filter(r=>r.date&&r.close!=null&&(!r.symbol||String(r.symbol).toUpperCase().includes('TQQQ'))).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function parseHistory(txt){
 const lines=String(txt||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!lines.length)return [];
 const headerIndex=lines.findIndex(line=>{let q=line.toLowerCase();return q.includes('date')&&q.includes('open')&&q.includes('high')&&q.includes('low')&&(q.includes('close')||q.includes('last'))});if(headerIndex<0)return [];
 const h=csvCells(lines[headerIndex]),key=names=>h.findIndex(x=>names.some(z=>x.toLowerCase().replace(/\s+/g,'').includes(z.replace(/\s+/g,''))));
 const ix={date:key(['date']),symbol:key(['symbol','ticker']),open:key(['open']),high:key(['high']),low:key(['low']),close:key(['close','last']),vol:key(['volume','vol']),rsi:key(['rsi14','rsi']),atr:key(['atr14','atr']),ema:key(['ema20']),s50:key(['sma50']),s200:key(['sma200']),avgvol:key(['avgvol20','averagevolume20'])};
 return lines.slice(headerIndex+1).map(line=>{let c=csvCells(line),g=i=>i>=0?c[i]:null;return {date:g(ix.date),symbol:ix.symbol>=0?g(ix.symbol):'TQQQ',open:n(g(ix.open)),high:n(g(ix.high)),low:n(g(ix.low)),close:n(g(ix.close)),volume:n(g(ix.vol)),rsi:n(g(ix.rsi)),atr:n(g(ix.atr)),ema20:n(g(ix.ema)),sma50:n(g(ix.s50)),sma200:n(g(ix.s200)),avgVol20:n(g(ix.avgvol))}}).filter(r=>r.date&&r.close!=null&&(!r.symbol||String(r.symbol).toUpperCase().includes('TQQQ'))).sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function mergeRows(base,incoming){const m=new Map();(base||[]).forEach(r=>r?.date&&m.set(r.date,r));(incoming||[]).forEach(r=>r?.date&&m.set(r.date,{...(m.get(r.date)||{}),...r}));return [...m.values()].sort((a,b)=>new Date(a.date)-new Date(b.date))}
function enrich(rs){
 const c=rs.map(r=>r.close),e20=ema(c,20),rsi14=calcRSI(c,14);const trs=rs.map((q,j)=>j?Math.max(q.high-q.low,Math.abs(q.high-c[j-1]),Math.abs(q.low-c[j-1])):q.high-q.low),atr14=wilder(trs,14);
 return rs.map((r,i)=>{const avPrev20=i>=20?mean(rs.slice(i-20,i).map(x=>x.volume)):null;const high252=i>=251?Math.max(...rs.slice(i-251,i+1).map(x=>x.high)):Math.max(...rs.slice(0,i+1).map(x=>x.high));const appAtr=atr14[i],usedAtr=r.atr??appAtr;return {...r,importedAtr:r.atr,appAtr,ema20:r.ema20??e20[i],sma50:r.sma50??sma(c,50,i),sma200:r.sma200??sma(c,200,i),rsi:r.rsi??rsi14[i],atr:usedAtr,atrPct:usedAtr/r.close*100,avgVol20:r.avgVol20??avPrev20,volRatio:(r.avgVol20??avPrev20)?r.volume/(r.avgVol20??avPrev20):null,emaSlope5:i>=5?((r.ema20??e20[i])/(rs[i-5].ema20??e20[i-5])-1)*100:null,pullback5:i>=5?(r.close/c[i-5]-1)*100:null,distEma:r.ema20!=null||e20[i]!=null?(r.close/(r.ema20??e20[i])-1)*100:null,distSma50:r.sma50!=null||sma(c,50,i)!=null?(r.close/(r.sma50??sma(c,50,i))-1)*100:null,high252,pctFromHigh:high252?(r.close/high252-1)*100:null};});
}
function viewRows(){let base=rows.slice();if(liveRow){base=mergeRows(base,[liveRow])}return enrich(base)}
function officialRows(){return enrich(rows.slice())}
function isFinalToday(){return !!rows.length}
function activeSource(){if(liveRow)return 'live';return rows.length?'final':'none'}
function currentAndPrev(){const vr=viewRows();return {vr,r:vr.at(-1),prev:vr.at(-2),i:vr.length-1}}
function officialCurrent(){const vr=officialRows();return {vr,r:vr.at(-1),prev:vr.at(-2),i:vr.length-1}}
function ruleVersionFor(playbook){return playbook==='Trend Reset'?'TrendReset-v1.0':'DeepRecovery-v1.0'}
function signalKey(date,playbook){return `${date}|${playbook}`}
function deepWashoutSnapshot(vr,i){if(i<0)return null;const recent=vr.slice(Math.max(0,i-19),i+1);const vals=recent.map(x=>x.pctFromHigh).filter(Number.isFinite);return vals.length?Math.min(...vals):null}
function freezeSnapshot(vr,r,i,playbook){
 return {
  signalDate:r.date,playbook,ruleVersion:ruleVersionFor(playbook),
  signalOpen:r.open,signalHigh:r.high,signalLow:r.low,signalClose:r.close,volume:r.volume,
  ema20:r.ema20,sma50:r.sma50,sma200:r.sma200,rsi14:r.rsi,
  atr14:r.atr,atrPct:r.atrPct,appAtr14:r.appAtr,importedAtr14:r.importedAtr,
  relativeVolume:r.volRatio,avgVol20:r.avgVol20,emaSlope5:r.emaSlope5,pullback5:r.pullback5,
  distanceFromEma20Pct:r.distEma,distanceFromSma50Pct:r.distSma50,pctFrom52WeekHigh:r.pctFromHigh,
  deepestRecentDrawdownPct:deepWashoutSnapshot(vr,i),
  dataCadence:'completed daily bar',signalExecutionModel:'next-session open',appVersion:APP_VERSION,capturedAt:new Date().toISOString()
 };
}
function upsertConfirmedSignal(vr,r,i,playbook){
 if(!r||!playbook)return null;
 const key=signalKey(r.date,playbook),snapshot=freezeSnapshot(vr,r,i,playbook);
 let sig=signals.find(x=>x.key===key);
 if(!sig){sig={key,signalDate:r.date,playbook,ruleVersion:ruleVersionFor(playbook),status:'SIGNALLED_NOT_TAKEN',taken:false,snapshot};signals.push(sig)}
 else if(!sig.snapshot){sig.snapshot=snapshot}
 localStorage.setItem(KEY_SIGNALS,JSON.stringify(signals));return sig;
}
function journalFinalSignals(vr,r,i){
 if(!r)return [];
 const a=trendResetState(vr,r,i,'final'),b=deepRecoveryState(vr,r,i,'final'),made=[];
 if(a.status==='BUY'){upsertConfirmedSignal(vr,r,i,'Trend Reset');made.push('Trend Reset')}

function daysSinceEntry(vr,date){
 const entryIdx=vr.findIndex(x=>x.date===date);
 if(entryIdx<0)return 1;

function localToday(){const d=new Date(),off=d.getTimezoneOffset();return new Date(d.getTime()-off*60000).toISOString().slice(0,10)}
function barsSinceBuy(vr,buyDate){return (vr||[]).filter(x=>x&&x.date&&buyDate&&x.date>=buyDate)}
function tradePath(vr,pos){
 const buyDate=pos.buyDate||pos.date;
 const bars=barsSinceBuy(vr,buyDate);
 const stop=pos.stop??pos.price*(1-EMERGENCY_STOP_PCT);
 let highest=pos.price,lowest=pos.price,stopTouched=false,gapBelowStop=false,stopDate=null,gapDate=null;
 bars.forEach(b=>{
   const entryDay=b.date===buyDate;
   // Daily high/low on the buy date may include price action that happened before Dad's actual fill.
   // To avoid false stop/milestone signals, use only the current/final price on the buy date.
   const effectiveHigh=entryDay?b.close:b.high;
   const effectiveLow=entryDay?b.close:b.low;
   if(Number.isFinite(effectiveHigh))highest=Math.max(highest,effectiveHigh);
   if(Number.isFinite(effectiveLow))lowest=Math.min(lowest,effectiveLow);
   if(!stopTouched && Number.isFinite(effectiveLow) && effectiveLow<=stop){stopTouched=true;stopDate=b.date}
   // Any session strictly after the actual buy date can legitimately gap through the stop.
   if(b.date>buyDate && !gapBelowStop && Number.isFinite(b.open) && b.open<stop){gapBelowStop=true;gapDate=b.date}
 });
 const maxGain=(highest/pos.price-1)*100,maxLoss=(lowest/pos.price-1)*100;
 return {bars,highest,lowest,maxGain,maxLoss,profitProven:maxGain>=6,runnerReached:maxGain>=10,strongRunner:maxGain>=15,stopTouched,stopDate,gapBelowStop,gapDate};
}

 const buyDate=position.buyDate||position.date;
 const hasCurrentTradeData=!!(r&&r.date>=buyDate);
 const currentPrice=hasCurrentTradeData?r.close:position.price;
 const pnl=(currentPrice/position.price-1)*100,day=daysSinceEntry(vr,buyDate)||1;
 const isTrend=position.playbook==='Trend Reset',maxDays=isTrend?7:10,path=tradePath(vr,position);
 // Persist milestones so a later pullback cannot erase what the trade already achieved.
 position.highestPrice=Math.max(position.highestPrice||position.price,path.highest);
 position.maxGainPct=Math.max(position.maxGainPct||0,path.maxGain);
 position.profitProven=!!(position.profitProven||path.profitProven);
 position.runnerReached=!!(position.runnerReached||path.runnerReached);
 position.strongRunner=!!(position.strongRunner||path.strongRunner);
 position.stopTouched=!!(position.stopTouched||path.stopTouched);
 position.stopTouchedDate=position.stopTouchedDate||path.stopDate||null;
 position.gapBelowStop=!!(position.gapBelowStop||path.gapBelowStop);
 position.gapBelowStopDate=position.gapBelowStopDate||path.gapDate||null;
 localStorage.setItem(KEY_POS,JSON.stringify(position));
 let state='HOLD',color='var(--blue)',msg=isTrend?'Trend Reset usually works over about 5–7 trading days.':'Deep Recovery usually needs more time — about 8–10 trading days.';
 if(!hasCurrentTradeData){state='BOUGHT';color='var(--blue)';msg='Trade recorded. Load today’s live TQQQ update to begin tracking the position.'}
 else if(position.gapBelowStop){state='GAPPED BELOW STOP';color='var(--red)';msg=`Price opened below the emergency stop on ${position.gapBelowStopDate||'a later session'}. Use Dad’s actual execution price — the stop price was not guaranteed.`}
 else if(position.stopTouched){state='STOP HIT';color='var(--red)';msg=`A saved daily bar traded at or below the $${fmt(position.stop)} emergency stop${position.stopTouchedDate?' on '+position.stopTouchedDate:''}. If this happened after Dad entered, treat the stop as triggered.`}
 else if(day>=maxDays){state='DECISION DAY';color='var(--yellow)';msg='The normal hold window has been reached. Review the chart and protect the trade.'}
 else if(!isTrend&&position.runnerReached){state='RUNNER';color='var(--green)';msg='Deep Recovery has reached +10% at least once. Protect profit, but do not automatically cap a strong recovery.'}
 else if(position.profitProven){state='PROFIT PROVEN';color='var(--green)';msg='This trade has reached the +6% profit checkpoint at least once. That milestone stays recorded even if price pulls back.'}
 const invested=position.price*position.qty,cash=Math.max(0,STARTING_ACCOUNT-invested);
 $('positionArea').innerHTML=`<div class="positionHero"><div class="positionTop"><div><div class="eyebrow">YOU OWN TQQQ</div><div class="positionTitle">${position.playbook}</div></div><div class="positionState" style="color:${color};background:color-mix(in srgb, ${color} 18%, transparent)">${state}</div></div><div class="positionGrid"><div class="stat"><b>$${fmt(position.price)}</b><span>bought</span></div><div class="stat"><b>$${fmt(currentPrice)}</b><span>now</span></div><div class="stat"><b style="color:${pnl>=0?'var(--green)':'var(--red)'}">${pnl>=0?'+':''}${pct(pnl)}</b><span>gain / loss</span></div><div class="stat"><b>${day}</b><span>trading day of ~${maxDays}</span></div></div><div class="actionText"><b>What to do:</b> ${msg}</div><div class="moneyPlan"><div class="moneyBox"><b>${position.qty}</b><span>shares owned</span></div><div class="moneyBox"><b>$${fmt(invested)}</b><span>dollars invested</span></div><div class="moneyBox"><b>$${fmt(position.stop)}</b><span>emergency stop</span></div><div class="moneyBox"><b>$${fmt(cash)}</b><span>cash remaining</span></div></div><div class="tiny" style="margin-top:9px">Signal: ${position.signalDate||'—'} · Bought: ${buyDate||'—'} · Best price since entry: $${fmt(position.highestPrice)} (${position.maxGainPct>=0?'+':''}${pct(position.maxGainPct)})<br>Buy-day note: the app uses the current/final price—not the day’s full high/low—because some of that movement may have happened before Dad’s fill.</div><div class="actions"><button class="btn sell" onclick="openSell()">RECORD SELL</button></div></div>`;
 const steps=tosSteps(position.playbook);
 $('detailsArea').innerHTML=`<div class="section"><div class="sectionTitle">What Dad should watch now</div><div class="sectionSub">Use the same line that created the trade.</div><div class="tosCard"><div class="tosTitle">${position.playbook}</div>${steps.map((x,k)=>`<div class="tosStep"><div class="num">${k+1}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div></div>`;
}
function openBuy(playbook,signalDate){
 const official=officialCurrent(),signalRow=official.vr.find(x=>x.date===signalDate);
 if(!signalRow)return alert('The confirmed signal bar could not be found. Reload history before recording the Buy.');
 const state=playbook==='Trend Reset'?trendResetState(official.vr,signalRow,official.vr.indexOf(signalRow),'final'):deepRecoveryState(official.vr,signalRow,official.vr.indexOf(signalRow),'final');
 if(state.status!=='BUY')return alert('That completed bar is no longer a confirmed Buy under the frozen rules.');
 const audit=atrParityAudit(official.vr);if(audit.status==='CHECK')return alert('ATR parity failed. Fix the data mismatch before recording a Buy.');
 const suggestedPrice=liveRow?.close??signalRow.close,qty=recommendedShares(suggestedPrice),today=localToday();
 $('tradeModalBox').innerHTML=`<div class="modalTitle">Buy plan</div><div class="tiny"><b>${playbook}</b> confirmed on ${signalDate}. The signal is not the trade. Record Dad’s actual fill when he buys in the next session.</div><div class="fieldLabel">Actual buy date</div><input class="field" id="buyDate" type="date" value="${today}"><div class="fieldLabel">Actual fill price</div><input class="field" id="buyPrice" value="${fmt(suggestedPrice)}" oninput="updateBuySizing()"><div class="fieldLabel">Shares to buy</div><input class="field" id="buyQty" value="${qty}" readonly><div id="buySizing"></div><div class="actions"><button class="btn secondary" onclick="closeModal()">CANCEL</button><button class="btn buy" onclick="confirmBuy('${playbook}','${signalDate}')">SAVE BUY</button></div>`;
 $('tradeModal').classList.add('show');updateBuySizing();
}

function confirmBuy(playbook,signalDate){
 const price=n($('buyPrice').value),qty=Math.floor(n($('buyQty').value)||0),buyDate=$('buyDate').value;
 if(!buyDate)return alert('Enter the actual buy date.');
 if(!price||qty<1)return alert('Enter a valid fill price.');
 if(buyDate<=signalDate)return alert('The actual buy must be in a trading session after the confirmed signal date.');
 if(buyDate>localToday())return alert('The actual buy date cannot be in the future.');
 const invested=price*qty;if(invested>MAX_TRADE_DOLLARS+0.01)return alert('Trade is above the $1,000 maximum. Please check the fill price.');
 const stop=price*(1-EMERGENCY_STOP_PCT),estimatedRisk=invested*EMERGENCY_STOP_PCT;
 const finalVr=enrich(rows.slice()),signalIndex=finalVr.findIndex(x=>x.date===signalDate),signalRow=signalIndex>=0?finalVr[signalIndex]:null;
 const entrySnapshot=signalRow?freezeSnapshot(finalVr,signalRow,signalIndex,playbook):{signalDate,playbook,ruleVersion:ruleVersionFor(playbook),note:'Signal snapshot unavailable'};
 const key=signalKey(signalDate,playbook);let sig=signals.find(x=>x.key===key);if(!sig&&signalRow)sig=upsertConfirmedSignal(finalVr,signalRow,signalIndex,playbook);
 if(sig){sig.status='BOUGHT';sig.taken=true;sig.buyDate=buyDate;sig.buyPrice=price;sig.qty=qty;sig.snapshot=sig.snapshot||entrySnapshot;localStorage.setItem(KEY_SIGNALS,JSON.stringify(signals));}
 position={signalKey:key,playbook,price,qty,buyDate,signalDate,ruleVersion:ruleVersionFor(playbook),appVersion:APP_VERSION,entrySnapshot,startingAccount:STARTING_ACCOUNT,maxTradeDollars:MAX_TRADE_DOLLARS,stop,estimatedRisk,highestPrice:price,maxGainPct:0,profitProven:false,runnerReached:false,strongRunner:false,stopTouched:false,gapBelowStop:false};
 localStorage.setItem(KEY_POS,JSON.stringify(position));closeModal();render();
}
function openSell(){const {r}=currentAndPrev(),today=localToday();$('tradeModalBox').innerHTML=`<div class="modalTitle">Record SELL</div><div class="tiny">Record the full exit. Keeping this all-or-none makes Dad’s cash and trade history much harder to mess up.</div><div class="fieldLabel">Actual sell date</div><input class="field" id="sellDate" type="date" value="${today}"><div class="fieldLabel">Actual sell price</div><input class="field" id="sellPrice" value="${fmt(r?.close??position.price)}"><div class="fieldLabel">Shares being sold</div><input class="field" value="${position.qty}" readonly><div class="actions"><button class="btn secondary" onclick="closeModal()">CANCEL</button><button class="btn sell" onclick="confirmSell()">SAVE FULL SELL</button></div>`;$('tradeModal').classList.add('show')}
function confirmSell(){const price=n($('sellPrice').value),sellDate=$('sellDate').value,buyDate=position.buyDate||position.date,qty=position.qty;if(!sellDate)return alert('Enter the actual sell date.');if(sellDate<buyDate)return alert('Sell date cannot be before the buy date.');if(sellDate>localToday())return alert('Sell date cannot be in the future.');if(!price)return alert('Enter a valid sell price.');const pnl=(price/position.price-1)*100,dollarPnl=(price-position.price)*qty;const finished={signalKey:position.signalKey||null,playbook:position.playbook,buyDate,sellDate,buy:position.price,sell:price,qty,pnl,dollarPnl,ruleVersion:position.ruleVersion,entrySnapshot:position.entrySnapshot||null,maxGainPct:position.maxGainPct||0,profitProven:!!position.profitProven,runnerReached:!!position.runnerReached,stopTouched:!!position.stopTouched,gapBelowStop:!!position.gapBelowStop};trades.push(finished);if(position.signalKey){const sig=signals.find(x=>x.key===position.signalKey);if(sig){sig.status='COMPLETED';sig.sellDate=sellDate;sig.sellPrice=price;sig.pnl=pnl;sig.dollarPnl=dollarPnl;sig.maxGainPct=position.maxGainPct||0;localStorage.setItem(KEY_SIGNALS,JSON.stringify(signals));}}position=null;localStorage.setItem(KEY_POS,JSON.stringify(position));localStorage.setItem(KEY_TRADES,JSON.stringify(trades));closeModal();render()}
function closeModal(){$('tradeModal').classList.remove('show')}
function handleHistory(file){const rd=new FileReader();rd.onload=()=>{const x=parseHistory(rd.result);if(!x.length)return alert('History file needs Date, Open, High, Low, Close/Last and Volume.');rows=mergeRows(rows,x);localStorage.setItem(KEY_ROWS,JSON.stringify(rows));render();alert(`History loaded. ${rows.length} completed daily bars are saved.`)};rd.readAsText(file)}
function handleLive(file){const rd=new FileReader();rd.onload=()=>{const x=parseCSV(rd.result,file.name);if(!x.length)return alert('I could not read this TQQQ TOS file.');liveRow=x.at(-1);localStorage.setItem(KEY_LIVE,JSON.stringify(liveRow));render();alert(`${liveRow.date} live TQQQ update loaded. This does NOT confirm a Buy.`)};rd.readAsText(file)}
function handleFinal(file){const rd=new FileReader();rd.onload=()=>{const x=parseCSV(rd.result,file.name);if(!x.length)return alert('I could not read this TQQQ TOS file.');const final=x.at(-1);rows=mergeRows(rows,[final]);liveRow=null;localStorage.setItem(KEY_ROWS,JSON.stringify(rows));localStorage.removeItem(KEY_LIVE);closeExpiredUntakenSignals(final.date);const vr=enrich(rows.slice()),audit=atrParityAudit(vr),i=vr.findIndex(r=>r.date===final.date);const saved=(audit.status==='CHECK')?[]:(i>=0?journalFinalSignals(vr,vr[i],i):[]);updateShadowOutcomes();render();alert(`${final.date} saved as the FINAL daily bar.${audit.status==='CHECK'?' ATR parity CHECK failed — Buy journaling is blocked until fixed.':(saved.length?' Confirmed signal journaled: '+saved.join(' + ')+'.':' No confirmed Buy signal today.')}`)};rd.readAsText(file)}
$('historyCsv').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleHistory(f);e.target.value=''})
$('liveCsv').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleLive(f);e.target.value=''})
$('finalCsv').addEventListener('change',e=>{const f=e.target.files[0];if(f)handleFinal(f);e.target.value=''})
$('tradeModal').addEventListener('click',e=>{if(e.target===$('tradeModal'))closeModal()})
render();
</script>
</body>
